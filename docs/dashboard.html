    <style>
        * {

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;

        .kpi-card {

        .kpi-card h3 {

            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .kpi-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        
        .kpi-card .sub-value {

        .chart-grid {

        .chart-card {

            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .chart-card h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
        }
        
        .chart-container {
            width: 100%;
            height: 300px;
        }
        
        .table-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .table-card h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
        }
        
        .table-scroll-container {
            height: 300px; /* 固定高度，约显示5行 */
            overflow: hidden;
            position: relative;
        }
        
        .table-scroll-container table tbody tr {
            height: 60px; /* 固定行高，确保5行正好填满容器 */
        }
        
        .table-scroll-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .table-scroll-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        
        .table-scroll-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        
        .table-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        
        thead {
            background: #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th {
            padding: 12px 8px;
            text-align: left;

        th.rank-col {
            width: 60px;

        th.team-col {

        th.center-col {

        th.amount-col {

        th.cumulative-col {

        td {

        }
        
        td.rank-col {
            text-align: center;
            font-weight: 700;

        }
        
        tbody tr {
            transition: background-color 0.2s;

        tbody tr:hover {

        .number {

        .positive {

        .loading {
            text-align: center;

        .error {
            background: #fee2e2;

            padding: 16px;
            border-radius: 12px;

        }

<body><div class="public-banner"><strong>管理者视图 · 已自动载入样板数据</strong>　<label>查看月份 <select id="demo-month"><option value="2026-01">2026 年 1 月</option><option value="2026-02">2026 年 2 月</option></select></label>　<a href="index.html#management">返回项目说明</a><p>费用金额单位均为元。回答本月费用来自哪里、哪些课题组与资源贡献较多、不同月份如何变化。源数据由同一分段计费核心生成。资源占用表示当月有计费记录的编号数量，面积使用率和月底时点占用需另行定义。</p></div>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>智慧大屏 - 费用管理</h1>
                <div class="dynamic-time" id="dynamic-time">--:--:--</div>
                <div class="meta-info" id="meta-info" style="display: none;"></div>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button class="refresh-btn" onclick="loadData()">刷新数据</button>
            </div>
        </div>
        
        <!-- KPI Cards -->
        <div class="kpi-grid" id="kpi-grid">
            <div class="loading">正在加载KPI数据...</div>
        </div>
        
        <!-- Charts -->
        <div class="chart-grid">
            <div class="chart-card">
                <h3>费用结构</h3>
                <div class="chart-container" id="chart-fee-structure"></div>
            </div>
            <div class="chart-card">
                <h3>费用排名（TOP10课题组）</h3>
                <div class="chart-container" id="chart-team-ranking"></div>
            </div>
            <div class="chart-card">
                <h3>中心对比</h3>
                <div class="chart-container" id="chart-center-comparison"></div>
            </div>
            <div class="chart-card">
                <h3>月度趋势</h3>
                <div class="chart-container" id="chart-monthly-trend"></div>
            </div>
        </div>
        
        <!-- Tables -->
        <div class="table-card">
            <h3>课题组费用表（TOP10）</h3>
            <div class="table-scroll-container" id="table-team-fees">
                <div class="loading">正在加载表格数据...</div>
            </div>
        </div>
    </div>
    
    <script>
        let dashboardData = null;
        let scrollTimer = null; // 保存滚动定时器引用
        let isHistoricalData = false; // 标记是否为历史数据
        
        // The published demo always starts from a prepared fictional JSON sample.
        async function loadData() {
            if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; }
            try {
                const month = document.getElementById('demo-month').value;
                const response = await fetch('dashboard-' + month + '.json');
                if (!response.ok) throw new Error('Sample data could not be loaded');
                dashboardData = await response.json();
                checkIfHistoricalData();
                renderDashboard();
            } catch (error) {
                document.getElementById('kpi-grid').textContent = '样板数据加载失败，请刷新页面重试。';
                console.error(error);
            }
        }

        function checkIfHistoricalData() {
            if (!dashboardData || !dashboardData.meta) {
                isHistoricalData = false;
                return;
            }
            
            const targetMonth = dashboardData.meta.目标月份;
            if (!targetMonth) {
                isHistoricalData = false;
                return;
            }
            
            const now = new Date();
            const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            isHistoricalData = targetMonth !== currentYearMonth;
        }
        
        // 渲染整个大屏
        function renderDashboard() {
            if (!dashboardData) return;
            
            // 更新元信息（只有历史数据才显示）
            const metaInfoEl = document.getElementById('meta-info');
            if (isHistoricalData) {
                const meta = dashboardData.meta || {};
                metaInfoEl.textContent = `目标月份: ${meta.目标月份 || '未知'} | 生成时间: ${meta.生成时间 || '未知'}`;
                metaInfoEl.style.display = 'block';
            } else {
                metaInfoEl.style.display = 'none';
            }
            
            // 渲染KPI
            renderKPIs();
            
            // 渲染图表
            renderCharts();
            
            // 渲染表格
            renderTables();
        }
        
        // 渲染KPI卡片
        function renderKPIs() {
            const kpis = dashboardData.kpis;
            const kpiGrid = document.getElementById('kpi-grid');
            
            const kpiCards = [
                {
                    title: '本月总费用',
                    value: formatNumber(kpis.本月总费用),
                    subValue: '元'
                },
                {
                    title: '本月实验室费用占比',
                    value: kpis.本月实验室费用占比.toFixed(2) + '%',
                    subValue: '实验室费用 / 总费用'
                },
                {
                    title: '办公室占用',
                    value: kpis.本月在用资源数.办公室,
                    subValue: `占用率: ${kpis.本月资源占用率.办公室?.toFixed(1) || 0}%`
                },
                {
                    title: '卡位占用',
                    value: kpis.本月在用资源数.卡位,
                    subValue: `占用率: ${kpis.本月资源占用率.卡位?.toFixed(1) || 0}%`
                },
                {
                    title: '实验室占用',
                    value: kpis.本月在用资源数.实验室,
                    subValue: `占用率: ${kpis.本月资源占用率.实验室?.toFixed(1) || 0}%`
                },
                {
                    title: '负80占用',
                    value: kpis.本月在用资源数.负80,
                    subValue: '仅显示数量'
                }
            ];
            
            kpiGrid.innerHTML = kpiCards.map(card => `
                <div class="kpi-card">
                    <h3>${card.title}</h3>
                    <div class="value">${card.value}</div>
                    <div class="sub-value">${card.subValue}</div>
                </div>
            `).join('');
        }
        
        // 渲染图表
        function renderCharts() {
            const charts = dashboardData.charts;
            
            // 费用结构（饼图）
            renderPieChart('chart-fee-structure', charts.费用结构, '资源类型', '金额');
            
            // 费用排名（横向条形图）
            renderBarChart('chart-team-ranking', charts.费用排名, '课题组', '当月金额');
            
            // 中心对比（堆叠柱状图）
            renderStackedBarChart('chart-center-comparison', charts.中心对比);
            
            // 月度趋势（折线图）
            renderLineChart('chart-monthly-trend', charts.月度趋势, '年月', '总费用');
        }
        
        // 饼图
        function renderPieChart(containerId, data, nameKey, valueKey) {
            const chart = echarts.getInstanceByDom(document.getElementById(containerId)) || echarts.init(document.getElementById(containerId));
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c} 元 ({d}%)'
                },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    data: data.map(item => ({
                        value: item[valueKey],
                        name: item[nameKey]
                    })),
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            };
            chart.setOption({...option, animation:false}, true);
        }
        
        // 横向条形图
        function renderBarChart(containerId, data, nameKey, valueKey) {
            const chart = echarts.getInstanceByDom(document.getElementById(containerId)) || echarts.init(document.getElementById(containerId));
            const sortedData = [...data].sort((a, b) => b[valueKey] - a[valueKey]);
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' }
                },
                grid: {
                    left: '20%',
                    right: '10%'
                },
                xAxis: {
                    type: 'value'
                },
                yAxis: {
                    type: 'category',
                    data: sortedData.map(item => item[nameKey])
                },
                series: [{
                    type: 'bar',
                    data: sortedData.map(item => item[valueKey]),
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                            { offset: 0, color: '#83bff6' },
                            { offset: 1, color: '#188df0' }
                        ])
                    }
                }]
            };
            chart.setOption({...option, animation:false}, true);
        }
        
        // 堆叠柱状图
        function renderStackedBarChart(containerId, data) {
            const chart = echarts.getInstanceByDom(document.getElementById(containerId)) || echarts.init(document.getElementById(containerId));
            
            // 按中心分组
            const centers = [...new Set(data.map(item => item.所属中心))];
            const types = [...new Set(data.map(item => item.资源类型))];
            
            const series = types.map(type => ({
                name: type,
                type: 'bar',
                stack: 'total',
                data: centers.map(center => {
                    const item = data.find(d => d.所属中心 === center && d.资源类型 === type);
                    return item ? item.金额 : 0;
                })
            }));
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' }
                },
                legend: {
                    data: types
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: centers
                },
                yAxis: {
                    type: 'value'
                },
                series: series
            };
            chart.setOption({...option, animation:false}, true);
        }
        
        // 折线图
        function renderLineChart(containerId, data, nameKey, valueKey) {
            const chart = echarts.getInstanceByDom(document.getElementById(containerId)) || echarts.init(document.getElementById(containerId));
            const sortedData = [...data].sort((a, b) => a[nameKey].localeCompare(b[nameKey]));
            const option = {
                tooltip: {
                    trigger: 'axis'
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: sortedData.map(item => item[nameKey])
                },
                yAxis: {
                    type: 'value'
                },
                series: [{
                    type: 'line',
                    data: sortedData.map(item => item[valueKey]),
                    smooth: true,
                    areaStyle: {
                        opacity: 0.3
                    },
                    lineStyle: {
                        width: 3
                    }
                }]
            };
            chart.setOption({...option, animation:false}, true);
        }
        
        // 渲染表格（带动态滚动和排名）
        function renderTables() {
            const table = dashboardData.tables.课题组费用表;
            const tableContainer = document.getElementById('table-team-fees');
            
            if (!table || table.length === 0) {
                tableContainer.innerHTML = '<div class="loading">暂无数据</div>';
                return;
            }
            
            // 只取TOP10
            const top10Table = table.slice(0, 10);
            
            // 过滤掉环比列，只保留需要的列
            const columnsToShow = ['所属课题组', '所属中心', '本月金额', '上月金额', '累计金额'];
            const firstRow = top10Table[0];
            const availableColumns = Object.keys(firstRow);
            
            // 确保列存在
            const displayColumns = columnsToShow.filter(col => availableColumns.includes(col));
            
            let html = '<table><thead><tr>';
            html += '<th class="rank-col">排名</th>'; // 添加排名列
            displayColumns.forEach(col => {
                let className = '';
                if (col === '所属课题组') className = 'team-col';
                else if (col === '所属中心') className = 'center-col';
                else if (col.includes('金额')) className = 'amount-col';
                html += `<th class="${className}">${col}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            top10Table.forEach((row, index) => {
                const rank = index + 1;
                
                html += '<tr>';
                html += `<td class="rank-col">${rank}</td>`; // 排名列
                
                displayColumns.forEach(col => {
                    let value = row[col];
                    let className = '';
                    
                    if (col.includes('金额')) {
                        className = 'number';
                        if (typeof value === 'number') {
                            value = formatNumber(value);
                        } else if (value === null || value === undefined) {
                            value = '—';
                        }
                    } else if (value === null || value === undefined) {
                        value = '—';
                    }
                    
                    html += `<td class="${className}">${value}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            tableContainer.innerHTML = html;
            
            // 添加平滑滚动效果（慢速滚动，显示5行）
            startTableScroll(tableContainer);
        }
        
        // 表格自动滚动效果（慢速滚动，默认显示5行）
        function startTableScroll(container) {
            const table = container.querySelector('table');
            if (!table) return;
            
            const tbody = table.querySelector('tbody');
            if (!tbody) return;
            
            const rows = tbody.querySelectorAll('tr');
            if (rows.length <= 5) {
                // 如果数据少于5行，不需要滚动
                return;
            }
            
            let scrollPosition = 0;
            const scrollSpeed = 0.25; // 慢速滚动（像素/帧）
            const scrollInterval = 50; // 降低帧率，更慢
            let isScrolling = true;
            let pauseAtBottom = false;
            
            function smoothScroll() {
                if (!isScrolling || pauseAtBottom) return;
                
                const maxScroll = container.scrollHeight - container.clientHeight;
                
                if (maxScroll <= 0) {
                    return;
                }
                
                scrollPosition += scrollSpeed;
                
                // 到达底部时，等待2秒后回到顶部
                if (scrollPosition >= maxScroll) {
                    pauseAtBottom = true;
                    setTimeout(() => {
                        scrollPosition = 0;
                        container.scrollTop = 0;
                        pauseAtBottom = false;
                    }, 2000);
                } else {
                    container.scrollTop = scrollPosition;
                }
            }
            
            // 鼠标悬停时暂停滚动
            container.addEventListener('mouseenter', () => {
                isScrolling = false;
            });
            
            container.addEventListener('mouseleave', () => {
                isScrolling = true;
            });
            
            // 开始滚动（保存定时器引用）
            scrollTimer = setInterval(smoothScroll, scrollInterval);
        }
        
        // 格式化数字
        function formatNumber(num) {
            if (num === null || num === undefined) return '—';
            return new Intl.NumberFormat('zh-CN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(num);
        }
        
        // 更新动态时间
        function updateDynamicTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
            const timeStr = `${hours}:${minutes}:${seconds}`;
            document.getElementById('dynamic-time').textContent = `${dateStr} ${timeStr}`;
        }
        
        // 页面加载时尝试自动加载数据
        window.addEventListener('load', () => {
            // 立即更新时间
            updateDynamicTime();
            // 每秒更新时间
            setInterval(updateDynamicTime, 1000);
            
            // 加载数据
            loadData();
            // 每5分钟自动刷新
            setInterval(() => {
                loadData();
            }, 5 * 60 * 1000);
        });
        
        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', () => {
            if (scrollTimer) {
                clearInterval(scrollTimer);
            }
        });
        
        // 窗口大小改变时重新调整图表
        window.addEventListener('resize', () => {
            if (dashboardData) {
                const chartIds = ['chart-fee-structure', 'chart-team-ranking', 
                                'chart-center-comparison', 'chart-monthly-trend'];
                chartIds.forEach(id => {
                    const chart = echarts.getInstanceByDom(document.getElementById(id));
                    if (chart) chart.resize();
                });
            }
        });
    </script>
<script>document.getElementById('demo-month').addEventListener('change',()=>loadData());</script></body>
</html>
